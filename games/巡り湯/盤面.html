<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>巡り湯 盤面</title>
<style>
  :root {
    --bg: #f4efe6; --paper: #fbf8f2; --ink: #2b2620; --sub: #7a6f62; --line: #d8cdbd;
    --neg: #b4442f; --pos: #2f6f8f; --zero: #8a8070; --pawn: #c58a1a; --gone: #b8b0a4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a17; --paper: #26221e; --ink: #ece5da; --sub: #a59a8b; --line: #3d3730;
      --neg: #e07a62; --pos: #6fb3d6; --zero: #a59a8b; --pawn: #e3ad48; --gone: #5c554d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; line-height: 1.6; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .08em; }
  .tag { font-size: 14px; color: var(--sub); }
  .now { margin-left: auto; font-size: 16px; padding: 4px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--paper); }
  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .board { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0;
    border: 2px solid var(--ink); background: var(--paper); aspect-ratio: 1.25; }
  .place { padding: 14px; border: 1px solid var(--line); position: relative; display: flex;
    flex-direction: column; gap: 8px; }
  .place h2 { margin: 0; font-size: 18px; letter-spacing: .2em; }
  .chars { display: flex; flex-direction: column; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); }
  .chip .name { flex: 1; font-size: 15px; }
  .chip .forbid { font-size: 11px; color: var(--sub); }
  .mood { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; min-width: 2.6em;
    text-align: right; font-weight: 600; }
  .bar { display: grid; grid-template-columns: repeat(7, 9px); gap: 2px; }
  .bar i { height: 9px; border-radius: 2px; background: var(--line); }
  .pawns { margin-top: auto; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sub); }
  .pawn { width: 16px; height: 16px; border-radius: 50%; background: var(--pawn); display: inline-block; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: .1em; }
  .days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .days li { display: flex; gap: 10px; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
  .days li.cur { background: var(--bg); outline: 1px solid var(--ink); }
  .days li.past { color: var(--sub); }
  .days b { min-width: 3.5em; }
  .small { font-size: 13px; color: var(--sub); }
  .once { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
  .gone { color: var(--gone); text-decoration: line-through; }
  section.play { margin-top: 22px; }
  .rows { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { min-width: 5.5em; font-size: 14px; color: var(--sub); }
  select, button { font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { cursor: pointer; border-color: var(--ink); }
  .out { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: pre-wrap; min-height: 2.5em; }
  .err { color: var(--neg); font-size: 13px; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--sub); font-weight: normal; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>巡り湯</h1>
    <span class="tag" id="episode"></span>
    <span class="now" id="now"></span>
  </header>

  <div class="layout">
    <div class="board" id="board"></div>
    <div class="side">
      <div class="card"><h3>事件の予定</h3><ul class="days" id="days"></ul>
        <div class="small">犯人は伏せられている。犯人の気分が値以下で条件を見る。</div></div>
      <div class="card"><h3>一周に限りのある札</h3><div class="once" id="once"></div></div>
      <div class="card"><h3>消えた人・死んだ人</h3><div id="gone" class="small"></div></div>
    </div>
  </div>

  <section class="play card">
    <h3>今日の手を組む</h3>
    <div class="rows" id="form"></div>
    <div class="err" id="err"></div>
    <div class="row"><button id="make">チャットに貼る文を作る</button><button id="copy">写す</button></div>
    <div class="out" id="out"></div>
  </section>

  <section class="play card">
    <h3>これまでの日</h3>
    <table><thead><tr><th>周・日</th><th>黒幕の札</th><th>瀬島の札</th><th>起きたこと</th></tr></thead>
    <tbody id="hist"></tbody></table>
  </section>
</div>

<script>
/* ===== ここだけを、毎日 Claude が書き換える（公開の情報だけ） ===== */
const STATE = {
  episode: "第一話「写真の中の女」",
  loop: 1, loops: 3, day: 1, phase: "朝・瀬島の番",
  chars: [
    { name: "坂巻 源治", key: "源治", place: "湯屋",   mood: 0,  forbid: "" },
    { name: "篠",        key: "篠",   place: "湯屋",   mood: 0,  forbid: "" },
    { name: "有馬 惣介", key: "有馬", place: "停車場", mood: 0,  forbid: "" },
    { name: "たえ",      key: "たえ", place: "製糸場", mood: 0,  forbid: "停車場" },
    { name: "室井 清彦", key: "清彦", place: "製糸場", mood: -1, forbid: "湯屋" },
    { name: "三条 鷹之", key: "三条", place: "写真館", mood: 0,  forbid: "" },
  ],
  pawns: ["湯屋", "湯屋"],
  gone: [],   // { key, how: "失踪" | "死" }
  incidents: { 2: ["失踪", -1], 3: ["火事", -2], 4: ["殺め", -1] },
  once: { mm: { "煽る": 1, "呼び出す": 1 }, pl: { "励ます": 1, "見守る": 2 } },
  history: [],  // { loop, day, mm: "…", pl: "…", note: "…" }
};
/* ===== ここまで ===== */

const PLACES = ["湯屋", "停車場", "写真館", "製糸場"];
const ADJ = { "湯屋": ["停車場", "写真館"], "停車場": ["湯屋", "製糸場"], "写真館": ["湯屋", "製糸場"], "製糸場": ["停車場", "写真館"] };
const $ = (id) => document.getElementById(id);
const goneKeys = new Set(STATE.gone.map(g => g.key));

$("episode").textContent = STATE.episode;
$("now").textContent = `${STATE.loop}周目／${STATE.loops}　${STATE.day}日目　${STATE.phase}`;

function moodColor(m) { return m < 0 ? "var(--neg)" : m > 0 ? "var(--pos)" : "var(--zero)"; }
function bar(m) {
  let s = '<span class="bar">';
  for (let v = -3; v <= 3; v++) {
    const on = (m < 0 && v < 0 && v >= m) || (m > 0 && v > 0 && v <= m);
    s += `<i style="${on ? `background:${moodColor(m)}` : v === 0 ? "background:var(--zero);opacity:.35" : ""}"></i>`;
  }
  return s + "</span>";
}

$("board").innerHTML = PLACES.map(p => {
  const cs = STATE.chars.filter(c => c.place === p && !goneKeys.has(c.key));
  const pw = STATE.pawns.filter(x => x === p).length;
  return `<div class="place"><h2>${p}</h2><div class="chars">${cs.map(c => `
    <div class="chip"><span class="name">${c.name}${c.forbid ? `<br><span class="forbid">入れない：${c.forbid}</span>` : ""}</span>
    ${bar(c.mood)}<span class="mood" style="color:${moodColor(c.mood)}">${c.mood > 0 ? "+" : ""}${c.mood}</span></div>`).join("")}
    </div>${pw ? `<div class="pawns">${'<span class="pawn"></span>'.repeat(pw)} 逗留客</div>` : ""}</div>`;
}).join("");

$("days").innerHTML = [1, 2, 3, 4].map(d => {
  const inc = STATE.incidents[d];
  const cls = d === STATE.day ? "cur" : d < STATE.day ? "past" : "";
  return `<li class="${cls}"><b>${d}日目</b><span>${inc ? `${inc[0]}（${inc[1]}以下）` : "―"}</span></li>`;
}).join("");

$("once").innerHTML =
  Object.entries(STATE.once.mm).map(([k, v]) => `<span>黒幕・${k}</span><span>残り ${v}</span>`).join("") +
  Object.entries(STATE.once.pl).map(([k, v]) => `<span>瀬島・${k}</span><span>残り ${v}</span>`).join("");

$("gone").innerHTML = STATE.gone.length
  ? STATE.gone.map(g => `<span class="gone">${g.key}</span>（${g.how}）`).join("、") : "なし";

$("hist").innerHTML = STATE.history.length
  ? STATE.history.map(h => `<tr><td>${h.loop}周・${h.day}日</td><td>${h.mm}</td><td>${h.pl}</td><td>${h.note}</td></tr>`).join("")
  : `<tr><td colspan="4" class="small">まだない</td></tr>`;

/* ---- 手を組む ---- */
const alive = STATE.chars.filter(c => !goneKeys.has(c.key));
const CARDS = [...PLACES.map(p => p + "へ"), "和ませる", "足止め", "励ます", "見守る"];
const LIMIT = { "和ませる": 2, "足止め": 1, "励ます": STATE.once.pl["励ます"], "見守る": STATE.once.pl["見守る"] };
PLACES.forEach(p => LIMIT[p + "へ"] = 1);

let html = "";
STATE.pawns.forEach((p, i) => {
  const opts = [p, ...ADJ[p]].map(x => `<option value="${x}">${x === p ? `${x}（そのまま）` : `${x}へ`}</option>`).join("");
  html += `<div class="row"><label>逗留客 ${i + 1}</label><select id="pawn${i}">${opts}</select></div>`;
});
for (let i = 0; i < 3; i++) {
  html += `<div class="row"><label>札 ${i + 1}</label>
    <select id="card${i}">${CARDS.map(c => `<option ${LIMIT[c] <= 0 ? "disabled" : ""}>${c}</option>`).join("")}</select>
    を <select id="who${i}">${alive.map(c => `<option value="${c.key}">${c.key}（${c.place}）</option>`).join("")}</select> に</div>`;
}
$("form").innerHTML = html;

$("make").onclick = () => {
  const picks = [0, 1, 2].map(i => ({ card: $("card" + i).value, who: $("who" + i).value }));
  const errs = [];
  if (new Set(picks.map(p => p.who)).size < 3) errs.push("三枚は、それぞれ別の町の人に置く。");
  const count = {};
  picks.forEach(p => count[p.card] = (count[p.card] || 0) + 1);
  for (const [c, n] of Object.entries(count)) if (n > LIMIT[c]) errs.push(`${c} は ${LIMIT[c]} 枚まで。`);
  picks.forEach(p => {
    if (p.card.endsWith("へ")) {
      const c = STATE.chars.find(x => x.key === p.who), to = p.card.slice(0, -1);
      if (!ADJ[c.place].includes(to)) errs.push(`${p.who}（${c.place}）から ${to} は隣でない（効かない）。`);
      if (c.forbid === to) errs.push(`${p.who} は ${to} に入れない（効かない）。`);
    }
  });
  $("err").textContent = errs.join(" ");
  const pawns = STATE.pawns.map((p, i) => `逗留客${i + 1}：${$("pawn" + i).value === p ? `${p}のまま` : `${$("pawn" + i).value}へ`}`).join("、");
  $("out").textContent = `${pawns}\n札：` + picks.map(p => `${p.who}に${p.card}`).join("、");
};
$("copy").onclick = () => navigator.clipboard.writeText($("out").textContent);
</script>
</body>
</html>
